<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Montserrat, Segoe UI, sans-serif">
  <!-- Fondo -->
  <rect width="1200" height="860" fill="#F0F4FF" rx="16"/>

  <!-- Título -->
  <rect x="0" y="0" width="1200" height="56" fill="#1E3A5F" rx="16"/>
  <rect x="0" y="40" width="1200" height="16" fill="#1E3A5F"/>
  <text x="600" y="36" text-anchor="middle" fill="white" font-size="20" font-weight="700">Data Warehouse — Esquema dw · Star Schema · SEDECO Viabilidad CDMX</text>

  <!-- ══════════════════════════════════════════
       TABLA DE HECHOS CENTRAL
  ══════════════════════════════════════════ -->
  <g>
    <rect x="430" y="290" width="340" height="320" fill="white" stroke="#1E3A5F" stroke-width="3" rx="10"/>
    <!-- Cabecera con degradado visual -->
    <rect x="430" y="290" width="340" height="40" fill="#1E3A5F" rx="10"/>
    <rect x="430" y="322" width="340" height="8" fill="#1E3A5F"/>
    <text x="600" y="308" text-anchor="middle" fill="white" font-size="9" opacity="0.8">TABLA DE HECHOS</text>
    <text x="600" y="322" text-anchor="middle" fill="white" font-size="14" font-weight="700">⭐ fact_consulta</text>

    <!-- Separador claves foráneas -->
    <rect x="440" y="338" width="320" height="18" fill="#EFF6FF" rx="4"/>
    <text x="600" y="350" text-anchor="middle" fill="#1E3A5F" font-size="9" font-weight="700">— CLAVES FORÁNEAS (dimensiones) —</text>

    <text x="445" y="372" fill="#374151" font-size="10"><tspan font-weight="700" fill="#1E3A5F">🔑 id</tspan>                  BIGSERIAL PK</text>
    <text x="445" y="389" fill="#374151" font-size="10"><tspan fill="#2563EB">🔗 id_tiempo_dia</tspan>        FK → dim_tiempo_dia</text>
    <text x="445" y="406" fill="#374151" font-size="10"><tspan fill="#2563EB">🔗 id_tiempo_mes</tspan>        FK → dim_tiempo_mes</text>
    <text x="445" y="423" fill="#374151" font-size="10"><tspan fill="#2563EB">🔗 id_alcaldia</tspan>          FK → dim_alcaldia</text>
    <text x="445" y="440" fill="#374151" font-size="10"><tspan fill="#2563EB">🔗 id_giro</tspan>              FK → dim_giro</text>
    <text x="445" y="457" fill="#374151" font-size="10"><tspan fill="#2563EB">🔗 id_persona_juridica</tspan>  FK → dim_persona</text>
    <text x="445" y="474" fill="#374151" font-size="10"><tspan fill="#2563EB">🔗 id_estado_tramite</tspan>    FK → dim_estado</text>

    <!-- Separador métricas -->
    <line x1="440" y1="485" x2="760" y2="485" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="440" y="487" width="320" height="18" fill="#F0FDF4" rx="4"/>
    <text x="600" y="499" text-anchor="middle" fill="#15803D" font-size="9" font-weight="700">— MÉTRICAS (hechos) —</text>

    <text x="445" y="520" fill="#374151" font-size="10">   score_viabilidad     NUMERIC(5,2)</text>
    <text x="445" y="537" fill="#374151" font-size="10">   nivel_viabilidad     VARCHAR(10)</text>
    <text x="445" y="554" fill="#374151" font-size="10">   inversion_estimada   NUMERIC(12,2)</text>
    <text x="445" y="571" fill="#374151" font-size="10">   dias_apertura_est    SMALLINT</text>
    <text x="445" y="588" fill="#374151" font-size="10">   dias_resolucion_real SMALLINT</text>
    <text x="445" y="600" fill="#6B7280" font-size="9" font-style="italic">   id_consulta_origen  UUID (ETL dedup)</text>

    <!-- Badge star -->
    <circle cx="755" cy="308" r="16" fill="#F59E0B" opacity="0.2"/>
    <text x="755" y="313" text-anchor="middle" font-size="16">⭐</text>
  </g>

  <!-- ══════════════════════════════════════════
       DIMENSIONES DE TIEMPO (arriba)
  ══════════════════════════════════════════ -->

  <!-- dim_tiempo_dia -->
  <g>
    <rect x="80" y="68" width="200" height="155" fill="white" stroke="#7C3AED" stroke-width="2" rx="8"/>
    <rect x="80" y="68" width="200" height="30" fill="#7C3AED" rx="8"/>
    <rect x="80" y="90" width="200" height="8" fill="#7C3AED"/>
    <text x="180" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="700">dim_tiempo_dia</text>
    <text x="92" y="116" fill="#374151" font-size="10"><tspan font-weight="700" fill="#7C3AED">🔑 id_dia</tspan>    YYYYMMDD INT PK</text>
    <text x="92" y="133" fill="#374151" font-size="10">   fecha        DATE</text>
    <text x="92" y="150" fill="#374151" font-size="10">   anio         SMALLINT</text>
    <text x="92" y="167" fill="#374151" font-size="10">   mes          SMALLINT</text>
    <text x="92" y="184" fill="#374151" font-size="10">   dia          SMALLINT</text>
    <text x="92" y="201" fill="#374151" font-size="10">   dia_semana   VARCHAR(12)</text>
    <text x="92" y="210" fill="#6B7280" font-size="9" font-style="italic">   3,652 filas · 2020–2030</text>
  </g>

  <!-- dim_tiempo_mes -->
  <g>
    <rect x="310" y="68" width="200" height="140" fill="white" stroke="#7C3AED" stroke-width="2" rx="8"/>
    <rect x="310" y="68" width="200" height="30" fill="#7C3AED" rx="8"/>
    <rect x="310" y="90" width="200" height="8" fill="#7C3AED"/>
    <text x="410" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="700">dim_tiempo_mes</text>
    <text x="322" y="116" fill="#374151" font-size="10"><tspan font-weight="700" fill="#7C3AED">🔑 id_mes</tspan>  YYYYMM INT PK</text>
    <text x="322" y="133" fill="#374151" font-size="10">   anio       SMALLINT</text>
    <text x="322" y="150" fill="#374151" font-size="10">   mes        SMALLINT</text>
    <text x="322" y="167" fill="#374151" font-size="10">   nombre_mes VARCHAR(12)</text>
    <text x="322" y="184" fill="#374151" font-size="10">   trimestre  VARCHAR(8)</text>
    <text x="322" y="195" fill="#6B7280" font-size="9" font-style="italic">   132 filas · 2020–2030</text>
  </g>

  <!-- dim_tiempo_trimestre / semestre / anio (agrupados) -->
  <g>
    <rect x="540" y="68" width="320" height="110" fill="white" stroke="#7C3AED" stroke-width="2" rx="8"/>
    <rect x="540" y="68" width="320" height="30" fill="#7C3AED" rx="8"/>
    <rect x="540" y="90" width="320" height="8" fill="#7C3AED"/>
    <text x="700" y="88" text-anchor="middle" fill="white" font-size="11" font-weight="700">dim_tiempo_trimestre / semestre / anio</text>
    <text x="552" y="116" fill="#374151" font-size="10">dim_tiempo_trimestre  🔑 id: YYYYTt (ej: 2025T1)</text>
    <text x="552" y="133" fill="#374151" font-size="10">dim_tiempo_semestre   🔑 id: YYYYSs (ej: 2025S1)</text>
    <text x="552" y="150" fill="#374151" font-size="10">dim_tiempo_anio       🔑 id: YYYY   (int)</text>
    <text x="552" y="163" fill="#6B7280" font-size="9" font-style="italic">   Dimensiones conformadas pre-generadas. Rango 2020–2030.</text>
  </g>

  <!-- ══════════════════════════════════════════
       DIMENSIONES LATERALES
  ══════════════════════════════════════════ -->

  <!-- dim_alcaldia (izquierda) -->
  <g>
    <rect x="60" y="310" width="220" height="175" fill="white" stroke="#0369A1" stroke-width="2" rx="8"/>
    <rect x="60" y="310" width="220" height="30" fill="#0369A1" rx="8"/>
    <rect x="60" y="332" width="220" height="8" fill="#0369A1"/>
    <text x="170" y="330" text-anchor="middle" fill="white" font-size="11" font-weight="700">dim_alcaldia</text>
    <text x="72" y="358" fill="#374151" font-size="10"><tspan font-weight="700" fill="#0369A1">🔑 id</tspan>          SERIAL PK</text>
    <text x="72" y="375" fill="#374151" font-size="10">   clave_dw      CHAR(3)</text>
    <text x="72" y="392" fill="#374151" font-size="10">   nombre        VARCHAR(60)</text>
    <text x="72" y="409" fill="#374151" font-size="10">   nombre_corto  VARCHAR(20)</text>
    <text x="72" y="426" fill="#374151" font-size="10">   poblacion     INTEGER</text>
    <text x="72" y="443" fill="#374151" font-size="10">   zona_cdmx     VARCHAR(20)</text>
    <text x="72" y="455" fill="#6B7280" font-size="9" font-style="italic">   16 alcaldías CDMX</text>
    <text x="72" y="468" fill="#6B7280" font-size="9" font-style="italic">   Dimensión conformada</text>
  </g>

  <!-- dim_giro (izquierda abajo) -->
  <g>
    <rect x="60" y="520" width="220" height="155" fill="white" stroke="#0369A1" stroke-width="2" rx="8"/>
    <rect x="60" y="520" width="220" height="30" fill="#0369A1" rx="8"/>
    <rect x="60" y="542" width="220" height="8" fill="#0369A1"/>
    <text x="170" y="540" text-anchor="middle" fill="white" font-size="11" font-weight="700">dim_giro</text>
    <text x="72" y="566" fill="#374151" font-size="10"><tspan font-weight="700" fill="#0369A1">🔑 id</tspan>          SERIAL PK</text>
    <text x="72" y="583" fill="#374151" font-size="10">   clave_giro    VARCHAR(20)</text>
    <text x="72" y="600" fill="#374151" font-size="10">   nombre        VARCHAR(100)</text>
    <text x="72" y="617" fill="#374151" font-size="10">   categoria     VARCHAR(60)</text>
    <text x="72" y="634" fill="#374151" font-size="10">   tipo_siapem   VARCHAR(10)</text>
    <text x="72" y="651" fill="#374151" font-size="10">   nivel_riesgo  VARCHAR(10)</text>
    <text x="72" y="664" fill="#6B7280" font-size="9" font-style="italic">   SCD Tipo 2 (versionado)</text>
  </g>

  <!-- dim_persona_juridica (derecha) -->
  <g>
    <rect x="920" y="310" width="230" height="155" fill="white" stroke="#0369A1" stroke-width="2" rx="8"/>
    <rect x="920" y="310" width="230" height="30" fill="#0369A1" rx="8"/>
    <rect x="920" y="332" width="230" height="8" fill="#0369A1"/>
    <text x="1035" y="330" text-anchor="middle" fill="white" font-size="11" font-weight="700">dim_persona_juridica</text>
    <text x="932" y="358" fill="#374151" font-size="10"><tspan font-weight="700" fill="#0369A1">🔑 id</tspan>          SERIAL PK</text>
    <text x="932" y="375" fill="#374151" font-size="10">   clave         VARCHAR(10)</text>
    <text x="932" y="392" fill="#374151" font-size="10">   nombre        VARCHAR(80)</text>
    <text x="932" y="409" fill="#374151" font-size="10">   requiere_notario BOOLEAN</text>
    <text x="932" y="426" fill="#374151" font-size="10">   capital_min   NUMERIC</text>
    <text x="932" y="443" fill="#374151" font-size="10">   complejidad   VARCHAR(10)</text>
    <text x="932" y="455" fill="#6B7280" font-size="9" font-style="italic">   PF / PFAE / SAS / SA de CV</text>
  </g>

  <!-- dim_estado_tramite (derecha abajo) -->
  <g>
    <rect x="920" y="500" width="230" height="140" fill="white" stroke="#0369A1" stroke-width="2" rx="8"/>
    <rect x="920" y="500" width="230" height="30" fill="#0369A1" rx="8"/>
    <rect x="920" y="522" width="230" height="8" fill="#0369A1"/>
    <text x="1035" y="520" text-anchor="middle" fill="white" font-size="11" font-weight="700">dim_estado_tramite</text>
    <text x="932" y="548" fill="#374151" font-size="10"><tspan font-weight="700" fill="#0369A1">🔑 id</tspan>          SERIAL PK</text>
    <text x="932" y="565" fill="#374151" font-size="10">   clave         VARCHAR(20)</text>
    <text x="932" y="582" fill="#374151" font-size="10">   nombre        VARCHAR(60)</text>
    <text x="932" y="599" fill="#374151" font-size="10">   color_hex     CHAR(7)</text>
    <text x="932" y="616" fill="#374151" font-size="10">   es_terminal   BOOLEAN</text>
    <text x="932" y="628" fill="#6B7280" font-size="9" font-style="italic">   Catálogo universal</text>
  </g>

  <!-- ══════════════════════════════════════════
       DATA MARTS (abajo)
  ══════════════════════════════════════════ -->
  <rect x="60" y="720" width="1080" height="120" fill="white" stroke="#059669" stroke-width="2" rx="10"/>
  <rect x="60" y="720" width="1080" height="32" fill="#059669" rx="10"/>
  <rect x="60" y="744" width="1080" height="8" fill="#059669"/>
  <text x="600" y="742" text-anchor="middle" fill="white" font-size="13" font-weight="700">📊 DATA MARTS — Vistas pre-calculadas (dw.v_*)</text>

  <!-- Mart 1 -->
  <rect x="80" y="760" width="240" height="68" fill="#ECFDF5" stroke="#059669" stroke-width="1" rx="6"/>
  <text x="200" y="776" text-anchor="middle" fill="#059669" font-size="10" font-weight="700">Mart 1 · Ejecutivo SEDECO</text>
  <text x="200" y="792" text-anchor="middle" fill="#374151" font-size="9">v_kpi_ejecutivo</text>
  <text x="200" y="806" text-anchor="middle" fill="#374151" font-size="9">v_tendencia_mensual_12m</text>
  <text x="200" y="820" text-anchor="middle" fill="#6B7280" font-size="8">KPIs · SLA · tendencia mensual</text>

  <!-- Mart 2 -->
  <rect x="340" y="760" width="240" height="68" fill="#EFF6FF" stroke="#2563EB" stroke-width="1" rx="6"/>
  <text x="460" y="776" text-anchor="middle" fill="#2563EB" font-size="10" font-weight="700">Mart 2 · Territorial</text>
  <text x="460" y="792" text-anchor="middle" fill="#374151" font-size="9">v_consultas_por_alcaldia</text>
  <text x="460" y="806" text-anchor="middle" fill="#374151" font-size="9">v_viabilidad_promedio_alcaldia</text>
  <text x="460" y="820" text-anchor="middle" fill="#6B7280" font-size="8">Demanda · Score · Zona</text>

  <!-- Mart 3 -->
  <rect x="600" y="760" width="240" height="68" fill="#FDF4FF" stroke="#9333EA" stroke-width="1" rx="6"/>
  <text x="720" y="776" text-anchor="middle" fill="#9333EA" font-size="10" font-weight="700">Mart 3 · Regulatorio</text>
  <text x="720" y="792" text-anchor="middle" fill="#374151" font-size="9">v_consultas_por_tipo_giro</text>
  <text x="720" y="806" text-anchor="middle" fill="#374151" font-size="9">v_tiempo_resolucion_tramite</text>
  <text x="720" y="820" text-anchor="middle" fill="#6B7280" font-size="8">Giros · Tiempos · SLA por trámite</text>

  <!-- Mart 4 -->
  <rect x="860" y="760" width="240" height="68" fill="#FFFBEB" stroke="#D97706" stroke-width="1" rx="6"/>
  <text x="980" y="776" text-anchor="middle" fill="#D97706" font-size="10" font-weight="700">Mart 4 · Fomento</text>
  <text x="980" y="792" text-anchor="middle" fill="#374151" font-size="9">v_programas_por_giro</text>
  <text x="980" y="806" text-anchor="middle" fill="#374151" font-size="9">v_tasa_conversion_apoyo</text>
  <text x="980" y="820" text-anchor="middle" fill="#6B7280" font-size="8">Programas · Conversión · Apoyo</text>

  <!-- ══════════════════════════════════════════
       FLECHAS dimensiones → fact
  ══════════════════════════════════════════ -->

  <!-- dim_tiempo_dia → fact -->
  <line x1="180" y1="223" x2="500" y2="290" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="496,285 503,291 497,297" fill="#7C3AED"/>

  <!-- dim_tiempo_mes → fact -->
  <line x1="410" y1="208" x2="520" y2="290" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="516,285 523,291 516,297" fill="#7C3AED"/>

  <!-- dim_tiempo_trim/sem/anio → fact -->
  <line x1="600" y1="178" x2="600" y2="290" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="596,285 600,293 604,285" fill="#7C3AED"/>

  <!-- dim_alcaldia → fact -->
  <line x1="280" y1="395" x2="430" y2="420" stroke="#0369A1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="425,416 433,420 426,426" fill="#0369A1"/>

  <!-- dim_giro → fact -->
  <line x1="280" y1="590" x2="430" y2="510" stroke="#0369A1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="424,506 432,511 426,517" fill="#0369A1"/>

  <!-- dim_persona → fact -->
  <line x1="920" y1="390" x2="770" y2="440" stroke="#0369A1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="775,435 768,440 774,446" fill="#0369A1"/>

  <!-- dim_estado → fact -->
  <line x1="920" y1="560" x2="770" y2="510" stroke="#0369A1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="775,506 768,511 775,516" fill="#0369A1"/>

  <!-- fact → Data Marts -->
  <line x1="600" y1="610" x2="600" y2="720" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="596,715 600,723 604,715" fill="#059669"/>
  <text x="612" y="668" fill="#059669" font-size="9" font-weight="600">ETL diario</text>
  <text x="612" y="680" fill="#059669" font-size="9">idempotente</text>

  <!-- Etiquetas de cardinalidad -->
  <text x="295" y="375" fill="#0369A1" font-size="9" font-weight="600">N:1</text>
  <text x="295" y="570" fill="#0369A1" font-size="9" font-weight="600">N:1</text>
  <text x="880" y="375" fill="#0369A1" font-size="9" font-weight="600">N:1</text>
  <text x="880" y="540" fill="#0369A1" font-size="9" font-weight="600">N:1</text>
  <text x="175" y="255" fill="#7C3AED" font-size="9" font-weight="600">N:1</text>
  <text x="395" y="240" fill="#7C3AED" font-size="9" font-weight="600">N:1</text>
  <text x="615" y="240" fill="#7C3AED" font-size="9" font-weight="600">N:1</text>

  <!-- Leyenda inferior izquierda -->
  <rect x="60" y="688" width="380" height="24" fill="white" stroke="#E5E7EB" rx="4"/>
  <rect x="72" y="697" width="12" height="3" fill="#7C3AED"/>
  <text x="90" y="704" fill="#7C3AED" font-size="9" font-weight="600">Dimensiones de tiempo</text>
  <rect x="210" y="697" width="12" height="3" fill="#0369A1"/>
  <text x="228" y="704" fill="#0369A1" font-size="9" font-weight="600">Dimensiones de negocio</text>
  <rect x="350" y="697" width="12" height="3" fill="#059669"/>
  <text x="368" y="704" fill="#059669" font-size="9" font-weight="600">Data Marts</text>
</svg>
