[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

# Timeout extendido para la función de análisis IA (Claude puede tardar hasta 25s)
[functions.analizar-viabilidad]
  timeout = 26

[functions.ejecutar-etl]
  timeout = 26
